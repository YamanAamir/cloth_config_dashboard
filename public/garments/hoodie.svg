<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcdcdc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8c8c8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="shadowRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.12" />
    </linearGradient>
  </defs>

  <!-- Hoodie body back view -->
  <path d="M 80,100 L 10,195 L 75,210 L 75,440 L 325,440 L 325,210 L 390,195 L 320,100
           Q 290,85 270,80 Q 250,75 200,75 Q 150,75 130,80 Q 110,85 80,100 Z"
        fill="url(#fabricGrad)" stroke="#c0c0c0" stroke-width="1.5"/>

  <!-- Hood (back view — large rounded shape) -->
  <path d="M 130,80 Q 150,30 200,20 Q 250,30 270,80 Q 250,90 200,92 Q 150,90 130,80 Z"
        fill="url(#hoodGrad)" stroke="#b8b8b8" stroke-width="1.5"/>
  <!-- Hood inner shadow -->
  <path d="M 145,78 Q 200,68 255,78 Q 240,88 200,90 Q 160,88 145,78 Z"
        fill="#c8c8c8" opacity="0.5"/>
  <!-- Hood seam -->
  <line x1="200" y1="20" x2="200" y2="90" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Left sleeve -->
  <path d="M 80,100 Q 40,125 10,195 L 75,210 Q 78,165 85,128 Z"
        fill="#e0e0e0" stroke="#c0c0c0" stroke-width="1"/>

  <!-- Right sleeve -->
  <path d="M 320,100 Q 360,125 390,195 L 325,210 Q 322,165 315,128 Z"
        fill="#e0e0e0" stroke="#c0c0c0" stroke-width="1"/>

  <!-- Shadow overlays -->
  <path d="M 80,100 L 75,440 L 115,440 L 112,210 L 75,210 L 80,100 Z" fill="url(#shadowLeft)" />
  <path d="M 320,100 L 325,440 L 285,440 L 288,210 L 325,210 L 320,100 Z" fill="url(#shadowRight)" />

  <!-- Kangaroo pocket (back has none, but center seam) -->
  <line x1="200" y1="90" x2="200" y2="435" stroke="#d0d0d0" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.5"/>

  <!-- Bottom ribbed hem -->
  <path d="M 75,428 Q 200,438 325,428 L 325,440 Q 200,450 75,440 Z" fill="#c8c8c8" opacity="0.5"/>
  <line x1="75" y1="430" x2="325" y2="430" stroke="#c0c0c0" stroke-width="0.8"/>
  <line x1="75" y1="434" x2="325" y2="434" stroke="#c0c0c0" stroke-width="0.8"/>
  <line x1="75" y1="438" x2="325" y2="438" stroke="#c0c0c0" stroke-width="0.8"/>

  <!-- Sleeve cuffs -->
  <path d="M 10,195 Q 42,203 75,210" stroke="#b0b0b0" stroke-width="2.5" fill="none"/>
  <path d="M 390,195 Q 358,203 325,210" stroke="#b0b0b0" stroke-width="2.5" fill="none"/>
  <path d="M 12,200 Q 43,207 75,213" stroke="#b8b8b8" stroke-width="1" fill="none"/>
  <path d="M 388,200 Q 357,207 325,213" stroke="#b8b8b8" stroke-width="1" fill="none"/>
</svg>
